<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-Frame-Options" content="deny">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/36e08fc954.js" crossorigin="anonymus"></script>
    <link href="https://fonts.cdnfonts.com/css/instagram-sans-script" rel="stylesheet">
    <title>Instagram Clone</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-top">
                <img src="instagram-logo.png" id="brand-logo">
          <span class="sidebar-item">
            <i class="fa-solid fa-house"></i>
            <p>Home</p>
          </span>
          <span class="sidebar-item">
            <i class="fa-solid fa-search"></i>
            <p>Search</p>
          </span>
          <span class="sidebar-item">
            <i class="fa-solid fa-compass"></i>
            <p>Explore</p>
          </span>
          <span class="sidebar-item">
            <i class="fa-solid fa-clapperboard"></i>
            <p>Reels</p>
          </span>
          <span class="sidebar-item">
            <i class="fa-solid fa-comment-dots"></i>
            <p>Messages</p>
          </span>
          <span class="sidebar-item">
            <i class="fa-solid fa-heart"></i>
            <p>Notifications</p>
          </span>
          <span class="sidebar-item">
            <i class="fa-solid fa-square-plus"></i>
            <p>Create</p>
          </span>
          <span class="sidebar-item">
            <img
            style="padding: 0px;margin: 0px;width: 30px;height: 30px;"
            class="profile-img"
            src="https://i.pinimg.com/736x/a3/31/a8/a331a8d0a8ff50827c6cb3437f336a30.jpg"
            />
            <p>Profile</p>
          </span>
                
            </div>
          
          <span class="sidebar-item">
            <i class="fa-solid fa-bars"></i>
            <p>More</p>
          </span>
        </div>
        
        <div class="main">
            <div class="card">
                <img
                class="main-img" 
                src="https://content.nationalgeographic.com.es/medio/2019/01/17/aurora-boreal-svolvear-noruega_ddbe9d47_800x1147.jpg">
            </div>
            <div class="card">
                <img
                class="main-img" 
                src="https://mx.web.img3.acsta.net/pictures/21/02/09/00/46/0475862.jpg">
            </div>
            <div class="card">
                <img
                class="main-img" 
                src="https://1.bp.blogspot.com/-i_AH1SpR4Lo/X9FzAFGQVhI/AAAAAAAAYWw/4boqLiDhyE4Wb3Od3NONLCHdGHUh1x1agCLcBGAsYHQ/s640/luna-santa-musica-medicina.jpg">
            </div>
            <div class="card">
                <img
                class="main-img" 
                src="https://cdn4.uvnimg.com/d8/35/3e34a3b94632aefbf81ca6a12840/monlaferte.jpg">
            </div>
            <div class="card">
                <img
                class="main-img" 
                src="https://www.dzoom.org.es/wp-content/uploads/2021/05/luna-inspiracion-05-734x551.jpg">
            </div>
        </div>
        
    </div>
    
</body>
</html>
